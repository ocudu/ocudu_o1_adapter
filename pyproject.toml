[tool.black]
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.pylint]
disable = ["fixme"]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
install_types = true
non_interactive = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ncclient.*", "deepdiff.*"]
ignore_missing_imports = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist = 
  format
  lint
  type

[testenv:format]
skip_install = true
deps =
  black
  isort
commands =
  black src
  isort src

[testenv:lint]
deps =
  pylint
  -r requirements.txt
commands =
  pylint src

[testenv:type]
skip_install = true
deps =
  mypy
  -r requirements.txt
commands =
  mypy src
"""
